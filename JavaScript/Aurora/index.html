<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora — Focus & Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Animated aurora blobs -->
  <div class="aurora" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Particle constellation -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Cursor glow -->
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <!-- Confetti -->
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="app">

    <header class="topbar">
      <div class="logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
            <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="logo-text">Aurora</span>
      </div>

      <div class="topbar-right">
        <span class="date-chip" id="dateChip"></span>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle color theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">✦ Your day, in flow</p>
        <h1 class="hero-title">Make today <span class="gradient-text">count</span>.</h1>
        <p class="hero-sub">Small steps, beautifully tracked. Add a task and watch your progress glow.</p>
      </section>

      <div class="grid">

        <!-- Tasks -->
        <section class="panel tasks-panel">
          <form class="task-form" id="taskForm" autocomplete="off">
            <input
              type="text"
              id="taskInput"
              class="task-input"
              placeholder="What needs to get done?"
              maxlength="90"
              aria-label="New task">
            <button type="submit" class="btn-add">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              <span>Add</span>
            </button>
          </form>

          <div class="filters" role="tablist">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="active">Active</button>
            <button class="filter" data-filter="done">Done</button>
          </div>

          <ul class="task-list" id="taskList"></ul>

          <div class="empty" id="emptyState">
            <div class="empty-orb"></div>
            <p class="empty-title">All clear</p>
            <p class="empty-sub">Add your first task to get started</p>
          </div>
        </section>

        <!-- Progress -->
        <aside class="panel side-panel">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 120 120">
              <defs>
                <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#7c5cff"/>
                  <stop offset="50%" stop-color="#22d3ee"/>
                  <stop offset="100%" stop-color="#ff5c8a"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="60" cy="60" r="52"/>
              <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"/>
            </svg>
            <div class="ring-label">
              <span id="ringPct">0%</span>
              <small>complete</small>
            </div>
          </div>

          <div class="stats">
            <div class="stat">
              <span class="stat-value" id="statTotal">0</span>
              <small>Total</small>
            </div>
            <div class="stat">
              <span class="stat-value" id="statActive">0</span>
              <small>Active</small>
            </div>
            <div class="stat">
              <span class="stat-value" id="statDone">0</span>
              <small>Done</small>
            </div>
          </div>

          <button class="btn-ghost" id="clearDone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
            </svg>
            Clear completed
          </button>
        </aside>

      </div>
    </main>

    <footer class="footer">
      <span>End of the page.</span>
    </footer>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
