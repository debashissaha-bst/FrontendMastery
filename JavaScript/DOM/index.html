<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM Learning</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 id="heading">DOM Concepts</h1>

    <p id="description">
        Learning about the Document Object Model (DOM)
    </p>

    <hr>

    <!-- Buttons -->
    <button id="btn">Click Me</button>

    <button id="changeTextBtn">Change Text</button>

    <button id="changeColorBtn">Change Color</button>

    <hr>

    <!-- Input -->
    <h2>Input Example</h2>

    <input
        type="text"
        id="nameInput"
        placeholder="Enter your name"
    >

    <button id="nameBtn">Show Name</button>

    <p id="nameOutput"></p>

    <hr>

    <!-- List -->
    <h2>My List</h2>

    <ul id="itemList">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <button id="addItemBtn">Add Item</button>

    <button id="removeItemBtn">Remove Item</button>

    <hr>

    <!-- Counter -->
    <h2>Counter</h2>

    <h3 id="count">0</h3>

    <button id="increaseBtn">Increase</button>

    <button id="decreaseBtn">Decrease</button>

    <button id="resetBtn">Reset</button>

    <hr>

    <!-- Class Example -->
    <h2 id="classHeading">Class Manipulation</h2>

    <button id="addClassBtn">Add Class</button>

    <button id="removeClassBtn">Remove Class</button>

    <button id="toggleClassBtn">Toggle Class</button>

    <hr>

    <!-- Image -->
    <h2>Attribute Example</h2>

    <img
        id="myImage"
        src="cat.png"
        alt="Cat"
    >

    <br><br>

    <button id="changeImageBtn">Change Image</button>

    <hr>

    <!-- Form -->
    <h2>Form Example</h2>

    <form id="myForm">

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >

        <button type="submit">Submit</button>

    </form>

    <p id="formOutput"></p>

    <script src="script.js"></script>

</body>

</html>
